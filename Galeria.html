<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería | Tuna UNI</title>

  <script src="js/header.js" defer></script>
  <script src="js/gallery-data.js"></script>
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/styles.css">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ==================== GALERÍA GRID ==================== */
    .page-banner {
      width: min(1180px, calc(100% - 2rem));
      min-height: 110px;
      margin: 1rem auto 0;
      padding: 0.8rem 1rem;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 10px 18px rgba(84, 16, 16, 0.18);
    }

    .page-banner h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0;
      font-weight: 700;
    }

    .gallery-section {
      padding: 2.5rem 1rem 1.8rem;
      background: linear-gradient(135deg, #f8f8f8 0%, #fafafa 100%);
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .gallery-header h1 {
      color: var(--primary-color);
      font-size: clamp(1.7rem, 3.2vw, 2.2rem);
      margin-bottom: 0.45rem;
      font-weight: 700;
    }

    .gallery-header p {
      color: var(--text-light);
      max-width: 700px;
      margin: 0 auto;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: white;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--transition);
      height: 280px;
    }

    .gallery-item:hover {
      transform: scale(1.03);
      box-shadow: var(--shadow-lg);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: contain;
      background: #f1eee9;
      transition: var(--transition);
      display: block;
      z-index: 0;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .gallery-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(133, 1, 1, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 2.5rem;
      color: white;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    .gallery-caption {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 3;
      padding: 0.8rem 0.85rem;
      min-height: 4.25rem;
      max-height: 5.3rem;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text-dark);
      font-size: 0.82rem;
      line-height: 1.45;
      letter-spacing: 0.01em;
      text-align: left;
    }

    .month-folder {
      position: relative;
      display: block;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: white;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(133, 1, 1, 0.08);
      transition: var(--transition);
      cursor: pointer;
    }

    .month-folder:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .month-cover {
      position: relative;
      aspect-ratio: 1.2;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(133, 1, 1, 0.14), rgba(196, 166, 90, 0.18));
    }

    .month-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05);
    }

    .month-folder-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.75rem 0.9rem;
      background: #fff;
    }

    .month-folder-name {
      font-weight: 700;
      color: var(--primary-color);
      font-size: 1.1rem;
      margin: 0;
    }

    .month-folder-count {
      color: var(--text-light);
      font-size: 0.84rem;
      margin: 0;
    }

    .month-folder-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(133, 1, 1, 0.08);
      font-size: 1.5rem;
    }

    .month-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 999px;
      background: var(--primary-color);
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .empty-month-message {
      max-width: 620px;
      margin: 2rem auto;
      padding: 2rem 1.25rem;
      border: 1px solid rgba(133, 1, 1, 0.12);
      border-radius: var(--radius-lg);
      background: white;
      color: var(--text-light);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .empty-month-message strong {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--primary-color);
      font-size: 1.2rem;
    }

    /* ==================== MODAL LIGHTBOX ==================== */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      animation: fadeIn 0.3s ease;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: zoomIn 0.3s ease;
    }

    .modal-image {
      width: 100%;
      max-height: calc(85vh - 5rem);
      object-fit: contain;
      border-radius: var(--radius-lg);
      display: block;
      background: #000;
    }

    .modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      transition: var(--transition);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      transition: var(--transition);
      z-index: 2001;
    }

    .modal-nav:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .modal-nav.prev {
      left: 10px;
    }

    .modal-nav.next {
      right: 10px;
    }

    .modal-counter {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 20px;
    }

    .modal-description {
      position: static;
      width: min(100%, 620px);
      min-height: 4rem;
      max-height: 6rem;
      overflow-y: auto;
      align-self: center;
      color: white;
      font-size: 0.96rem;
      line-height: 1.5;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.72);
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      text-align: center;
      border-left: 3px solid var(--accent-gold);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }

      .gallery-item img {
        height: 100%;
      }

      .gallery-item {
        height: 250px;
      }

      .modal-nav {
        font-size: 1.5rem;
        padding: 0.5rem 0.8rem;
      }

      .modal-close {
        top: 10px;
        right: 10px;
      }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.8rem;
      }

      .gallery-item img {
        height: 100%;
      }

      .gallery-item {
        height: 210px;
      }

      .gallery-header h1 {
        font-size: 1.8rem;
      }

      .modal-nav {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <!-- Header dinámico -->
  <div class="header-placeholder"></div>

  <div class="page-banner">
    <h1>Galería Tuna UNI</h1>
  </div>

  <!-- Galería -->
  <section class="gallery-section">
    <div class="container">
      <div class="gallery-header">
        <p>Momentos memorables de nuestras presentaciones, eventos y celebraciones. Explora los álbumes por época y mes.</p>
      </div>

      <div class="album-tabs" id="album-tabs" style="display:flex; justify-content:center; flex-wrap:wrap; gap:0.75rem; margin:0 auto 2rem; max-width:700px;"></div>
      <div id="album-container"></div>
    </div>
  </section>

  <!-- Modal Lightbox -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <img class="modal-image" id="modal-image" src="" alt="">
      <button class="modal-nav prev" id="modal-prev" aria-label="Anterior">❮</button>
      <button class="modal-nav next" id="modal-next" aria-label="Siguiente">❯</button>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">&times;</button>
      <div class="modal-counter">
        <span id="current-image">1</span> / <span id="total-images">0</span>
      </div>
      <div class="modal-description" id="modal-description"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p style="margin-bottom: 0.5rem;">&copy; 2025 Tuna de la UNI</p>
      <p style="font-size: 0.9rem; color: var(--accent-gold);">Tradición, Alegría y Música Universitaria</p>
    </div>
  </footer>

  <script>
    let albums = window.galleryAlbums || {};
    let lastDescriptionsSnapshot = '';

    function normalizeDescriptions(data) {
      if (!data || typeof data !== 'object') return {};
      return Object.values(data).reduce((allDescriptions, group) => {
        if (group && typeof group === 'object') {
          Object.assign(allDescriptions, group);
        }
        return allDescriptions;
      }, {});
    }

    function applyDescriptionsFromJson(data) {
      const descriptions = normalizeDescriptions(data);
      Object.values(albums).forEach((album) => {
        if (!album || !Array.isArray(album.months)) return;

        album.months.forEach((month) => {
          if (!month || !Array.isArray(month.images)) return;

          month.images.forEach((image) => {
            const match = descriptions[image.src];
            if (match && match.description) {
              image.description = match.description;
            }
          });
        });
      });
    }

    function refreshGalleryDescriptions() {
      fetch(`descripciones-fotos.json?_=${Date.now()}`, { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('No se pudo cargar descripciones-fotos.json');
          return response.json();
        })
        .then((data) => {
          const snapshot = JSON.stringify(data);
          if (snapshot !== lastDescriptionsSnapshot) {
            lastDescriptionsSnapshot = snapshot;
            applyDescriptionsFromJson(data);
            if (typeof renderAlbums === 'function') {
              renderAlbums();
            }
          }
        })
        .catch((error) => {
          console.warn('No se pudo refrescar la galería:', error);
        });
    }

    let currentAlbumKey = 'antiguas';
    let currentMonthIndex = 0;
    let currentIndex = 0;
    let expandedMonth = null;
    let allImages = [];

    const albumTabs = document.getElementById('album-tabs');
    const albumContainer = document.getElementById('album-container');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modal-image');
    const modalClose = document.getElementById('modal-close');
    const modalPrev = document.getElementById('modal-prev');
    const modalNext = document.getElementById('modal-next');
    const currentImageSpan = document.getElementById('current-image');
    const totalImagesSpan = document.getElementById('total-images');
    const modalDescription = document.getElementById('modal-description');

    function collectAlbumImages() {
      const activeAlbum = albums[currentAlbumKey];
      allImages = [];

      if (currentAlbumKey === '2026' && expandedMonth) {
        const month = activeAlbum.months.find(item => item.name === expandedMonth);
        if (month) {
          allImages = month.images.map(item => ({ ...item, monthName: month.name }));
        }
      } else {
        activeAlbum.months.forEach((month) => {
          month.images.forEach((item) => {
            allImages.push({ ...item, monthName: month.name });
          });
        });
      }

      currentMonthIndex = 0;
      currentIndex = 0;
    }

    function renderAlbumTabs() {
      albumTabs.innerHTML = '';
      Object.entries(albums).forEach(([key, album]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = album.label;
        btn.style.cssText = `padding: 0.8rem 1.3rem; border: none; border-radius: 999px; font-weight: 700; cursor: pointer; background: ${key === currentAlbumKey ? 'var(--primary-color)' : '#f1e6d5'}; color: ${key === currentAlbumKey ? '#fff' : 'var(--primary-color)'}; box-shadow: 0 3px 8px rgba(0,0,0,0.08);`;
        btn.addEventListener('click', () => {
          currentAlbumKey = key;
          expandedMonth = null;
          collectAlbumImages();
          renderAlbums();
        });
        albumTabs.appendChild(btn);
      });
    }

    function renderAlbums() {
      const album = albums[currentAlbumKey];
      renderAlbumTabs();
      albumContainer.innerHTML = '';

      if (currentAlbumKey === '2026') {
        if (expandedMonth) {
          const backButton = document.createElement('button');
          backButton.type = 'button';
          backButton.className = 'month-back-btn';
          backButton.textContent = '← Volver a meses';
          backButton.addEventListener('click', () => {
            expandedMonth = null;
            renderAlbums();
          });
          albumContainer.appendChild(backButton);

          const selectedMonth = album.months.find(month => month.name === expandedMonth);
          if (!selectedMonth) {
            expandedMonth = null;
            renderAlbums();
            return;
          }

          if (selectedMonth.images.length === 0) {
            const emptyMessage = document.createElement('div');
            emptyMessage.className = 'empty-month-message';
            emptyMessage.innerHTML = `
              <strong>${selectedMonth.name}</strong>
              <span>Aún no hay fotos para mostrar en este mes.</span>
            `;
            albumContainer.appendChild(emptyMessage);
            totalImagesSpan.textContent = '0';
            return;
          }

          const grid = document.createElement('div');
          grid.className = 'gallery-grid';

          selectedMonth.images.forEach((image, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
              <img src="${image.src}" alt="${image.description}" onerror="this.src='https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop'">
              <div class="gallery-overlay">🔍</div>
              <div class="gallery-caption">${image.description}</div>
            `;
            item.addEventListener('click', () => {
              allImages = selectedMonth.images.map(item => ({ ...item, monthName: selectedMonth.name }));
              currentIndex = index;
              openModal();
            });
            grid.appendChild(item);
          });

          albumContainer.appendChild(grid);
          totalImagesSpan.textContent = selectedMonth.images.length;
          return;
        }

        const yearGrid = document.createElement('div');
        yearGrid.className = 'gallery-grid';

        album.months.forEach((month) => {
          const monthCard = document.createElement('button');
          monthCard.type = 'button';
          monthCard.className = 'month-folder';
          monthCard.innerHTML = `
            <div class="month-cover">
              <img src="${month.images[0]?.src || 'img/galeria/portada-sin-fotos.svg'}" alt="Portada de ${month.name}" onerror="this.src='img/galeria/portada-sin-fotos.svg'">
            </div>
            <div class="month-folder-meta">
              <div>
                <p class="month-folder-name">${month.name}</p>
                <p class="month-folder-count">${month.images.length} fotos</p>
              </div>
              <span class="month-folder-badge">📁</span>
            </div>
          `;
          monthCard.addEventListener('click', () => {
            expandedMonth = month.name;
            renderAlbums();
          });
          yearGrid.appendChild(monthCard);
        });

        albumContainer.appendChild(yearGrid);
        totalImagesSpan.textContent = album.months.reduce((sum, month) => sum + month.images.length, 0);
        return;
      }

      album.months.forEach((month) => {
        const monthWrap = document.createElement('div');
        monthWrap.style.marginBottom = '2rem';

        const title = document.createElement('h3');
        title.textContent = month.name;
        title.style.color = 'var(--primary-color)';
        title.style.marginBottom = '1rem';
        title.style.fontSize = '1.4rem';

        const grid = document.createElement('div');
        grid.className = 'gallery-grid';
        grid.style.marginBottom = '1.5rem';

        month.images.forEach((image) => {
          const item = document.createElement('div');
          item.className = 'gallery-item';
          item.innerHTML = `
            <img src="${image.src}" alt="${image.description}" onerror="this.src='https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop'">
            <div class="gallery-overlay">🔍</div>
            <div class="gallery-caption">${image.description}</div>
          `;
          item.addEventListener('click', () => {
            allImages = month.images.map(item => ({ ...item, monthName: month.name }));
            currentIndex = month.images.findIndex(entry => entry.src === image.src);
            openModal();
          });
          grid.appendChild(item);
        });

        monthWrap.appendChild(title);
        monthWrap.appendChild(grid);
        albumContainer.appendChild(monthWrap);
      });

      collectAlbumImages();
      totalImagesSpan.textContent = allImages.length;
    }

    function openModal() {
      modal.classList.add('show');
      updateModalImage();
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('show');
      document.body.style.overflow = 'auto';
    }

    function updateModalImage() {
      const currentItem = allImages[currentIndex];
      if (!currentItem) return;
      modalImage.src = currentItem.src;
      currentImageSpan.textContent = currentIndex + 1;
      totalImagesSpan.textContent = allImages.length;
      modalDescription.textContent = currentItem.description || 'Momento especial de la Tuna UNI';
    }

    function nextImage() {
      if (!allImages.length) return;
      currentIndex = (currentIndex + 1) % allImages.length;
      updateModalImage();
    }

    function prevImage() {
      if (!allImages.length) return;
      currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
      updateModalImage();
    }

    modalClose.addEventListener('click', closeModal);
    modalNext.addEventListener('click', nextImage);
    modalPrev.addEventListener('click', prevImage);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('show')) return;
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'Escape') closeModal();
    });

    refreshGalleryDescriptions();
    setInterval(refreshGalleryDescriptions, 3000);

    collectAlbumImages();
    renderAlbums();
  </script>
</body>

</html>
